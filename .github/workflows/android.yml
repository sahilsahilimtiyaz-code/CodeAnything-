name: Android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK packages
        run: |
          SDCM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDCM" --licenses > /dev/null
          "$SDCM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build extracted-intelligence (ships in APK assets)
        working-directory: extracted-intelligence
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test

      - name: Make gradlew executable
        working-directory: android-coding-agent
        run: chmod +x gradlew

      - name: Assemble debug + unit tests
        working-directory: android-coding-agent
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-coding-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
